# Ground truth: the correct extraction for every sample document.
#
# Captured from a run whose values were verified by hand against the
# source PDFs, then committed. Regenerate with
# scripts/export_ground_truth.py only after re-verifying.
#
# How each field is compared (see tests/test_accuracy.py):
#   exact     - document_type, customer_key, dates, amount,
#               payment_terms, customer_signature, item_count,
#               quantity, price, total_amount, burst_percentage,
#               burst_cap_units
#   contains  - billing_address, product_name (the model varies
#               punctuation and appends period qualifiers)
#   presence  - signature_evidence, technical_account_manager
#               (free text; reworded every run, all correct)
#   ambiguous - skipped entirely; the document does not determine it
#
# Only exact/contains fields count toward the accuracy denominator.

