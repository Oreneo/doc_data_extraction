# Canonical scalar field definitions for Order Forms / Purchase Orders,
# per the assignment spec. These descriptions are sent to the LLM as the
# field-by-field extraction instructions.
#
# `items` (the line-item list) is NOT defined here - its shape (product_name,
# quantity, price, total_amount, burst) is fixed in ExtractedContractData /
# the prompt template, since no customer variation has been observed in the
# *shape* of a line item, only in its column naming (which the LLM handles
# from context).
#
# Per-customer overrides live in customers/<key>.yaml and are merged on top
# of this file by field name.

fields:
  - name: start_date
    description: >
      The contract/subscription start date (labeled things like "Start Date",
      "Contract Start Date", or "Subscription Start Date"). May appear in prose
      ("January 1, 2025"), slash format ("3/1/2025"), or already as mm-dd-yyyy.
    format_hint: "mm-dd-yyyy"
    field_type: date
    required: true

  - name: end_date
    description: >
      The contract/subscription end date (labeled things like "End Date",
      "Contract End Date", or "Subscription End Date"). Same formats as start_date.
    format_hint: "mm-dd-yyyy"
    field_type: date
    required: true

  - name: amount
    description: >
      The total order/contract amount (labeled things like "Total fee",
      "Total PO Amount", or "Total Subscription Fee"). Output as a plain number,
      no currency symbol, no thousands separators.
    field_type: float
    required: true

  - name: payment_terms
    description: >
      Payment terms expressed as "Net xx" (xx = number of days). Some documents
      state this literally ("Net 30"); others only describe it in prose (e.g.
      "payment shall be made within thirty (30) days from invoice") - in that
      case, derive "Net 30" from the stated number of days.
    format_hint: "Net xx"
    field_type: string
    required: true

  - name: billing_address
    description: >
      The customer/buyer's billing address (labeled things like "Bill To",
      "Billing Address", or "Buyer Billing Address").
    field_type: string
    required: true

  - name: customer_signature
    description: >
      Whether the CUSTOMER/BUYER has actually signed. A signature is a MARK,
      not a name field.

      Set true ONLY when there is a real signature indicator on or above the
      signature line: a written or typed signature, "/s/ Name", an explicit
      "Signed", or a checkmark beside the signature label.

      Set false when the signature line itself is blank - EVEN IF the Name,
      Title and Date fields beneath it are filled in. Those fields identify
      who would sign and accompany a signature; they are not a signature.
      Also set false when the document has no signature section at all.

      Read the customer/buyer's signature, not the vendor's or seller's.
      Signature blocks often have two columns, one per party. Work out which
      party is the customer by cross-referencing the "Bill To" / "To:" /
      customer billing name elsewhere in the document, and read only that
      party's column. If the two columns cannot be told apart, say so in
      signature_evidence rather than guessing.
    field_type: bool
    required: true

  - name: signature_evidence
    description: >
      A short phrase recording what the document actually shows in the
      signature area, so the true/false above can be checked without
      reopening the PDF. Quote the indicator when there is one.

      Examples: "'✔ Signed' beside Buyer Signature"; "signature line blank,
      Name/Title/Date filled in"; "no signature section present".
    field_type: string
    required: false

  - name: technical_account_manager
    description: >
      Special term describing a dedicated technical/support contact assigned
      to the customer for the life of the contract (typically labeled
      "Technical Account Manager"). Set to null if the document does not
      mention anything like this.
    field_type: string
    required: false
